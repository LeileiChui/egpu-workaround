# eGPU workaround（app-misc/egpu-workaround）
# 见 /usr/share/doc/egpu-workaround-*/ 与 plan/egpu-automation-plan.md
#
# 1) 阻止 udev 通过 modalias 别名自动加载 nvidia —— 必须在 egpu-up.sh
#    做完 PCIe Gen3/HASD cap 之后再加载。
# 2) options：让【任何】方式加载 nvidia（显式 / 依赖 / 别名）都带上这些参数。
#    关键：RMPcieFLRPolicy=1 禁用驱动内部 FLR（避免 TB 上卸载/掉线时挂死）。
blacklist nvidia
blacklist nvidia_modeset
blacklist nvidia_uvm
blacklist nvidia_drm
blacklist nvidia_peermem

options nvidia NVreg_DynamicPowerManagement=0x00 NVreg_RegistryDwords=RMPcieFLRPolicy=1

# 3) compute-only：**硬性禁止图形 / modeset 模块**。
#    blacklist 只挡"自动/别名"加载，挡不住**显式/按需**加载 —— 例如 NVIDIA 的
#    GL/Vulkan/EGL 用户态会主动拉起 nvidia_modeset（见 C29 实测）。
#    `install <mod> /bin/false` 让**任何方式**的加载都失败（jciolek 同款做法），
#    从而保证 eGPU 永不获得显示/modeset 能力。CUDA 不受影响（只需 nvidia + nvidia_uvm）。
#    注意：`install` 只影响"加载"；`modprobe -r`（卸载）不受影响。
install nvidia_drm /bin/false
install nvidia_modeset /bin/false
