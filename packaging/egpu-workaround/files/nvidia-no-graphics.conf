# eGPU workaround (app-misc/egpu-workaround) — compute-only 加固
#
# 让 Portage 在安装 x11-drivers/nvidia-drivers 时【不安装】NVIDIA 的
# 图形/计算"入口文件"（Vulkan ICD / implicit layer / VulkanSC / EGL vendor /
# OpenCL ICD），从而让应用根本看不到 eGPU 的图形能力。
#
# 关联：/etc/portage/package.env/nvidia-no-graphics
# 说明：nvidia-drivers 没有可关掉这些文件的 USE flag，只能用 INSTALL_MASK。
#      CUDA 不受影响（走 libcuda.so，不经过这些入口文件）。
# 见 plan/egpu-automation-plan.md C29。
INSTALL_MASK="${INSTALL_MASK} /usr/share/vulkan/icd.d/nvidia_icd.json /usr/share/vulkan/implicit_layer.d/nvidia_layers.json /usr/share/vulkansc/icd.d/nvidia_icd_vksc.json /usr/share/glvnd/egl_vendor.d/10_nvidia.json /etc/OpenCL/vendors/nvidia.icd"
