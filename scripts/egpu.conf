# eGPU (RTX 5060 Ti @ FEVM FNGT5 PRO) automation configuration
# 被 egpu-up.sh / egpu-down.sh / egpu-bridge-cap.sh 读取。
# 安装到 /etc/egpu.conf 即可全局生效；否则用脚本同目录的副本。
#
# 采用 `: "${VAR:=default}"` 形式 → 已存在的环境变量优先（便于临时覆盖/测试）。

# ---- 设备识别 ----
: "${GPU_VID:=10de}"
: "${GPU_DID:=2d04}"
: "${TB_DEVICE_NAME:=FNGT5 PRO}"

# ---- 链路封顶（Gen4 + HASD）----
# 1=Gen1 2=Gen2 3=Gen3 4=Gen4(默认)
# 实测（2026-09-27，本机热插拔路径）：Gen4+HASD 稳定；相对 Gen3 单向 +7.5~15%、
# 双向聚合 +3.7%（总带宽被 40Gb/s TB 隧道限制）。9 分钟满载压测无 Xid、无自主重训练。
# 注意：只在"开机后插坞"的热插拔路径验证；冷启动路径社区有冻机记录，不适用于本方案但也别去试。
: "${CAP_TARGET_SPEED:=4}"
: "${CAP_SET_HASD:=1}"

# ---- 驱动加载 ----
# NVreg_RegistryDwords="RMPcieFLRPolicy=1" → 强制禁用驱动内部 FLR
#   （见 plan/egpu-flr-avoidance.md；NVIDIA 官方头文件 nvrm_registry.h 定义）
# NVreg_DynamicPowerManagement=0x00 → 禁 D3 运行态电源管理
: "${NV_MODULE_OPTS:=NVreg_DynamicPowerManagement=0x00 NVreg_RegistryDwords=RMPcieFLRPolicy=1}"

# ---- 超时 / 重试 ----
: "${WAIT_GPU_SEC:=15}"          # 等 GPU 出现的上限
: "${RESCAN_SETTLE_SEC:=2}"      # rescan 后等待
: "${RESCAN_RETRY_SEC:=3}"       # wait_for_gpu 期间重发 rescan 的间隔（坞隧道晚到自愈，C28）
: "${BAR_RETRY:=3}"              # BAR0=0 时 remove+rescan 重试次数
: "${BAR_REMOVE_SLEEP:=8}"       # remove 父桥后的等待（Damian 脚本用 8s）
: "${DRV_WAIT_SEC:=10}"          # 等 /dev/nvidia0

# switch-remove 二级恢复开关（危险，见 plan C15）：1=允许 0=禁用
: "${EGPU_ALLOW_SWITCH_REMOVE:=1}"

# ---- 运行时 ----
: "${STATE_DIR:=/run/egpu}"
: "${LOG_TAG:=egpu}"
